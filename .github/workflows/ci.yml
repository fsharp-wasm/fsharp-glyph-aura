name: CI

on:
  push:
    branches: [ "main", "copilot/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/GlyphAuro.Tests/GlyphAuro.Tests.fsproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: '**/TestResults/**/coverage.cobertura.xml'

  demo:
    name: Demo (ASCII render)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install DejaVu fonts
        run: sudo apt-get install -y fonts-dejavu

      - name: Build demo
        run: dotnet build demo/GlyphAuro.Demo/GlyphAuro.Demo.fsproj --configuration Release

      - name: Run demo
        run: dotnet run --project demo/GlyphAuro.Demo/GlyphAuro.Demo.fsproj --configuration Release

  nuget:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/GlyphAuro/GlyphAuro.fsproj --configuration Release --output ./nupkg

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nupkg/*.nupkg
